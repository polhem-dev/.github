name: Feature request
description: Suggest a new feature or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what makes it hard or impossible today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would like to happen. A sketch of the API or configuration helps.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Mockups or screenshots
      description: |
        For a UI change, attach a screenshot of the current screen marked up with the change, a mockup, or a short
        screen recording. Drag the files into this box.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other approaches you thought about.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this once the approach is agreed.
